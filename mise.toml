[tools]
uv = "latest"
typst = "0.15"

[tasks.lint]
run = "uv run ruff check"

[tasks.fmt]
run = "uv run ruff format --check"

[tasks.typecheck]
run = "uv run basedpyright"

[tasks.build]
depends = ["paper"]
run = "uv run inkflow build"

[tasks.serve]
run = "uv run inkflow serve"

[tasks.paper]
description = "Regenerate demo/main.typ from the lesson files and build the demo paper PDF"
run = "uv run python demo/act.py build"

[tasks.demo-check]
description = "Replay the Demo Time act and compile the paper as it stands after every scene"
run = "uv run python demo/act.py check"

[tasks.fix]
run = ["uv run ruff check --fix", "uv run ruff format"]

[tasks.check]
depends = ["lint", "fmt", "typecheck", "build", "demo-check"]
description = "Also fails if demo/main.typ is out of sync with the lesson files"
run = "git diff --exit-code demo/main.typ"
