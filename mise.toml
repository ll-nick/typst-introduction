[tools]
uv = "latest"
typst = "0.15"

[tasks.lint]
run = "uv run ruff check"

[tasks.fmt]
run = "uv run ruff format --check"

[tasks.typecheck]
run = "uv run basedpyright"

[tasks.build]
depends = ["paper"]
run = "uv run inkflow build"

[tasks.serve]
run = "uv run inkflow serve"

[tasks.paper]
description = "Compile the demo paper after every Demo Time scene"
run = "uv run python demo/check_act.py"

[tasks.fix]
run = ["uv run ruff check --fix", "uv run ruff format"]

[tasks.check]
depends = ["lint", "fmt", "typecheck", "build"]
